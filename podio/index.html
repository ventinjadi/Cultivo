async function pull(){if(!db||!user)return;busy=true;status("Buscando na nuvem…");const {data,error}=await db.from("podio_state").select("data").eq("user_id",user.id).maybeSingle();busy=false;if(error){status("Modo local · falha na nuvem");notify("Não foi possível conectar ao banco.");return}if(data){state=normalize(data.data);localStorage.setItem(key(),JSON.stringify(state));status("Sincronizado ✓");render()}else{status("Conta conectada · sem dados na nuvem");save()}}
document.addEventListener("click",async e=>{let t=e.target.closest("button");if(!t)return;let d=t.dataset;if(d.tab){tab=d.tab;editId=null;render();window.scrollTo(0,0);return}if(d.filter){filter=d.filter;render();return}if(!d.act)return;let id=d.id;switch(d.act){case"prev":offset--;render();break;case"next":offset++;render();break;case"want":case"seen":state.marks[id]??={};state.marks[id][d.act]=!state.marks[id][d.act];save();render();break;case"edit":editId=id;render();window.scrollTo(0,0);break;case"add":editId="new";render();window.scrollTo(0,0);break;case"cancel":editId=null;render();break;case"delete":if(confirm("Excluir este evento?")){state.events=state.events.filter(x=>x.id!==editId);state.events.push({id:editId,deleted:true});editId=null;save();render()}break;case"pull":await saveChain;await pull();break;case"logout":await saveChain;if(db)await db.auth.signOut();user=null;loadLocal();status("Modo local");render();break;case"backup":dl("podio-backup.json",JSON.stringify(state,null,2));break;case"template":dl("podio-curadoria.json",JSON.stringify({weekStart:"2026-11-30",summary:"Resumo editorial da semana",events:[SEED[0]]},null,2));break;case"install":if(install){await install.prompt();install=null}else notify("No Chrome: menu ⋮ → Instalar app ou Adicionar à tela inicial.");break;case"ics":{const es=all().filter(x=>state.marks[x.id]?.want&&x.time);if(!es.length){notify("Nenhum evento com horário na agenda.");break}const esc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g,m=>"\\"+m);let lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Podio//Agenda//PT"];for(let x of es){let start=new Date(x.date+"T"+x.time+":00-03:00"),end=new Date(+start+(x.duration||120)*60000),f=d=>d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";lines.push("BEGIN:VEVENT","UID:"+esc(x.id)+"@podio","DTSTAMP:"+f(new Date()),"DTSTART:"+f(start),"DTEND:"+f(end),"SUMMARY:"+esc(x.title),"DESCRIPTION:"+esc(x.watch+" — "+x.why),"END:VEVENT")}lines.push("END:VCALENDAR");dl("podio-agenda.ics",lines.join("\r\n"),"text/calendar");break}}});
document.addEventListener("change",e=>{if(e.target.id==="spoiler"){state.spoilers=e.target.checked;save();render()}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));if(f.id==="event"){const id=editId==="new"?crypto.randomUUID():editId;let x={...v,id,priority:Number(v.priority),duration:Number(v.duration)||120};state.events=state.events.filter(y=>y.id!==id);state.events.push(x);editId=null;save();render()}else if(f.id==="plans"){state.plans=v;save();render()}else if(f.id==="prefs"){state.preferences=state.preferences.map((p,i)=>({...p,favorites:v["fav"+i],competitions:v["comp"+i].split("\n").map(s=>s.trim()).filter(Boolean)}));save();render()}else if(f.id==="login"){if(!db){notify("Conexão indisponível. Verifique a internet.");return}status("Entrando…");const{data,error}=await db.auth.signInWithPassword({email:v.email,password:v.password});if(error){status("Login não realizado");notify("Não foi possível entrar: "+error.message);return}user=data.user;loadLocal();await pull();render()}else if(f.id==="import"){try{if(!v.file?.size)throw Error("Escolha um arquivo.");let j=JSON.parse(await v.file.text());if(!Array.isArray(j.events)||j.events.some(x=>!x.id||!x.title||!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||!x.sport||typeof x.time!=="string"))throw Error("Formato inválido.");const map=new Map(state.events.map(x=>[x.id,x]));j.events.forEach(x=>map.set(x.id,{...x,priority:Math.min(3,Math.max(1,Number(x.priority)||1)),duration:Number(x.duration)||120}));state.events=[...map.values()];state.weeklyDate=j.weekStart||"";state.weeklyNote=j.summary||"";save();tab="Semana";if(j.weekStart)offset=Math.round((day(j.weekStart)-day(monday(today())))/604800000);render()}catch(err){notify(err.message)}}});
async function refreshEditorial(){try{const r=await fetch("./curadoria.json",{cache:"no-store"});if(!r.ok)return;const j=await r.json();if(Array.isArray(j.events)){editorial=j;if(!selection().length&&all().some(x=>x.date>=today())){const next=all().filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];offset=Math.round((day(monday(next.date))-day(monday(today())))/604800000)}render()}}catch{}}window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();install=e});window.addEventListener("load",async()=>{loadLocal();if(selection().length===0&&all().some(x=>x.date>=today())){let next=all().filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];offset=Math.round((day(monday(next.date))-day(monday(today())))/604800000)}render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});if(window.supabase){db=window.supabase.createClient("https://xnqhbicvmjzqxzqnatqp.supabase.co","sb_publishable_mVvI7bFqNltSEXdX_qjPGw_zyK8v6Q4",{auth:{storageKey:"podio-auth-v1",persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const{data}=await db.auth.getSession();if(data.session){user=data.session.user;loadLocal();await pull();render()}}});loadLocal();render();refreshEditorial();
